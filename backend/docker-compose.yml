name: ranking-system

services:
  postgres:
    image: postgres:16
    container_name: ranking-postgres
    environment:
      POSTGRES_DB: ranking
      POSTGRES_USER: ranking
      POSTGRES_PASSWORD: ranking
    ports:
      - "15432:5432"

  redis:
    image: redis:7
    container_name: ranking-redis
    ports:
      - "16379:6379"
